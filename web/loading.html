<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALK 正在启动</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9efff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,90vw);text-align:center;padding:40px 24px}.orbit{width:94px;height:94px;margin:0 auto 32px;border:2px solid #42537a;border-top-color:#81a7ff;border-radius:50%;animation:spin 1.5s linear infinite;display:grid;place-items:center}.orbit span{animation:spin 1.5s linear infinite reverse;font-weight:800;color:#b9ccff}h1{font-size:27px;letter-spacing:.12em}p{color:#a6b4d1}.progress{height:8px;background:#28344c;border-radius:10px;overflow:hidden;margin:48px 0 14px}.bar{height:100%;width:0;background:linear-gradient(90deg,#597cf4,#8ac8ff);transition:width .3s}.step{min-height:24px}button{background:#668cf5;color:white;border:0;border-radius:8px;padding:10px 25px;cursor:pointer}#error{color:#ffb5b5;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orbit,.orbit span{animation:none}}
</style></head><body><main class="card"><div class="orbit"><span>TALK</span></div><h1>欢迎回来</h1><p>正在准备你的协作空间</p><div class="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="step" id="step">启动服务</div><div id="error" role="alert" hidden></div><button id="retry" hidden>重试</button></main>
<script>
const start=performance.now(), step=document.querySelector('#step'), error=document.querySelector('#error'), retry=document.querySelector('#retry'), bar=document.querySelector('#bar'), progress=document.querySelector('.progress'); let failures=0,timer;
function fail(message){clearTimeout(timer);step.textContent='启动遇到问题';error.textContent=message+' 请查看 logs/launcher/。';error.hidden=false;retry.hidden=false}
async function poll(){try{const response=await fetch('/api/boot/status',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();failures=0;if(!data.ready){fail('启动阶段报错。');return}const stages=data.stages||[];let i=0;function show(){if(i>=stages.length){const target=new URL('/',location.origin);if(new URLSearchParams(location.search).get('desktop')==='1')target.search='?desktop=1';setTimeout(()=>location.replace(target),Math.max(0,600-(performance.now()-start)));return}const stage=stages[i++];step.textContent=stage.name+(stage.text?'：'+stage.text:'');let value=Math.round(i/stages.length*100);bar.style.width=value+'%';progress.setAttribute('aria-valuenow',value);timer=setTimeout(show,120)}show()}catch(e){if(++failures>=3){fail('无法连接启动状态接口。');return}timer=setTimeout(poll,300)}}retry.onclick=()=>{failures=0;error.hidden=true;retry.hidden=true;step.textContent='重新检查启动状态';poll()};poll();
</script></body></html>
