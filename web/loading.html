<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALK 正在启动</title>
<script>(function(){var m='midnight';try{var s=new URLSearchParams(location.search).get('theme')||localStorage.getItem('talk-theme-mode');m=s==='light'||s==='daylight'?'daylight':s==='auto'&&new Date().getHours()>=8&&new Date().getHours()<18?'daylight':'midnight'}catch(e){}document.documentElement.dataset.theme=m})()</script>
<link rel="stylesheet" href="/theme-tokens.css?v=821">
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,var(--glow),var(--bg));color:var(--text);font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(620px,92vw);text-align:center;padding:32px 24px}.orbit{position:relative;width:190px;height:190px;margin:0 auto 24px;display:grid;place-items:center}.orbit-ring{position:absolute;border:1px solid var(--line-strong);border-radius:50%;animation:spin 9s linear infinite}.orbit-ring:nth-child(1){inset:0}.orbit-ring:nth-child(2){inset:19px;animation-duration:7s;animation-direction:reverse}.orbit-ring:nth-child(3){inset:38px;animation-duration:5s}.orbit-ring::before{content:'';position:absolute;top:50%;left:-4px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue)}.orbit-ring:nth-child(2)::before{background:var(--green);box-shadow:0 0 12px var(--green)}.orbit-logo{width:82px;height:82px;display:grid;place-items:center;border:1px solid var(--blue);border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;animation:breathe 3s ease-in-out infinite}h1{font-size:27px;letter-spacing:.12em}p{color:var(--muted-strong)}.step{min-height:24px;margin-top:30px}.progress{height:8px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin:14px 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s}.loading-steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.step-chip{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;color:var(--muted);background:var(--card-soft)}.step-chip.done{color:var(--green);border-color:var(--green)}.step-chip.doing{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}.step-chip small{font-size:12px}button{background:var(--accent-bg);color:var(--accent-fg);border:0;border-radius:var(--radius);padding:10px 25px;cursor:pointer}#error{color:var(--red);line-height:1.6}.runner-note{margin-top:24px;text-align:left;padding:16px;border-radius:var(--radius);border:1px solid var(--line);line-height:1.6}.runner-note p{margin:6px 0 0}.runner-note.none{background:var(--warning-bg);border-color:var(--amber)}.runner-note.detected{background:var(--success-bg);border-color:var(--green)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{box-shadow:0 0 28px var(--blue)}}@media(prefers-reduced-motion:reduce){.orbit-ring,.orbit-logo{animation:none}.bar{transition:none}}
</style></head><body><main class="card"><div class="orbit" aria-hidden="true"><div class="orbit-ring"></div><div class="orbit-ring"></div><div class="orbit-ring"></div><div class="orbit-logo">TALK</div></div><h1>欢迎回来</h1><p>正在准备你的协作空间</p><div class="step" id="step" aria-live="polite">启动服务</div><div class="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="loading-steps" id="loading-steps" aria-label="启动步骤"></div><div id="runner-none" class="runner-note none" hidden><strong>未检测到可用的运行器：服务已启动但尚未接入 TALK，当前无法分配或接收任务</strong><p>请安装 Codex、KimiCode、WorkBuddy 或 DSH，随后重新启动并完成接入。</p></div><div id="runner-detected" class="runner-note detected" hidden><strong id="runner-detected-text"></strong></div><div id="error" role="alert" hidden></div><button id="retry" hidden>重试</button><button id="continue" hidden>继续进入</button></main>
<script>
const start=performance.now(), step=document.querySelector('#step'), error=document.querySelector('#error'), retry=document.querySelector('#retry'), continueButton=document.querySelector('#continue'), bar=document.querySelector('#bar'), progress=document.querySelector('.progress'), chips=document.querySelector('#loading-steps');
const labels=['启动服务','检测运行器','接入 MCP','启动自动角色','检查更新/下载','就绪'];
let failures=0,timer;
function render(states, detail=''){
  chips.replaceChildren(...labels.map((label,i)=>{const chip=document.createElement('span');chip.className='step-chip '+states[i];chip.textContent=(states[i]==='done'?'✓ ':'')+label;if(i===4&&detail){const small=document.createElement('small');small.textContent=' · '+detail;chip.append(small)}return chip}));
  const done=states.filter(s=>s==='done').length, value=Math.round(done/labels.length*100);bar.style.width=value+'%';progress.setAttribute('aria-valuenow',value);
  const active=states.indexOf('doing');step.textContent=active<0?'准备就绪':labels[active]+(active===4&&detail?'：'+detail:'');
}
function fail(message){clearTimeout(timer);step.textContent='启动遇到问题';error.textContent=message+' 请查看 logs/launcher/。';error.hidden=false;retry.hidden=false}
function finish(delay){const target=new URL('/',location.origin);if(new URLSearchParams(location.search).get('desktop')==='1')target.search='?desktop=1';timer=setTimeout(()=>location.replace(target),Math.max(delay||0,600-(performance.now()-start)) )}
function show(data,shortFlow){
  const launcher=data.launcher, download=launcher&&launcher.download;
  const detail=!launcher?'无需下载/跳过':download&&download.needed===false?'无需下载':'';
  const states=labels.map(()=> 'pending');
  if(data.service_ready)states[0]='done';
  if(launcher){states[1]='done';states[2]='done'}
  if(download&&download.needed===false)states[4]='done';
  if(!launcher)states[4]='done';
  if(Array.isArray(data.stages))data.stages.forEach(stage=>{const index=labels.indexOf(stage.name);if(index>=0&&index<5&&stage.state==='complete')states[index]='done'});
  if(data.service_ready===true && launcher && launcher.ready===false){render(states,detail);step.textContent='启动完成，存在警告';error.textContent='启动配置存在问题，请查看 logs/launcher/。服务已就绪，可继续使用。';error.hidden=false;continueButton.hidden=false;finish(5000);return}
  if(!data.service_ready){const active=states.indexOf('pending');if(active>=0)states[active]='doing';render(states,detail);fail('启动阶段报错。');return}
  const sequence=shortFlow?[5]:[3,4,5];let i=0;
  function advance(){while(i<sequence.length&&states[sequence[i]]==='done')i++;if(i===sequence.length){render(labels.map(()=> 'done'),detail);finish();return}const index=sequence[i++];states[index]='doing';render(states,detail);timer=setTimeout(()=>{states[index]='done';advance()},120)}advance();
}
async function poll(){try{const response=await fetch('/api/boot/status',{cache:'no-store'});if(response.status===404){show({service_ready:true,ready:true,launcher:null},true);return}if(!response.ok)throw Error();const data=await response.json();failures=0;
  const runners=data.runners;if(runners&&typeof runners.none==='boolean'&&Array.isArray(runners.detected)){const names={codex:'Codex',kimi:'KimiCode',workbuddy:'WorkBuddy',dsh:'DSH'};document.querySelector('#runner-none').hidden=!runners.none;document.querySelector('#runner-detected').hidden=runners.none;document.querySelector('#runner-detected-text').textContent='本机已安装 '+runners.detected.map(n=>names[n]||n).join('、')+'，可接入使用'}
  const shortFlow=!Array.isArray(data.stages)||typeof data.ready!=='boolean'||typeof data.service_ready!=='boolean'||!Object.prototype.hasOwnProperty.call(data,'launcher')||!data.launcher;
  if(typeof data.ready!=='boolean')data.ready=true;if(typeof data.service_ready!=='boolean')data.service_ready=true;
  show(data,shortFlow);
}catch(e){if(++failures>=3){fail('无法连接启动状态接口。');return}timer=setTimeout(poll,300)}}
continueButton.onclick=()=>{clearTimeout(timer);finish(0)};
retry.onclick=()=>{clearTimeout(timer);failures=0;error.hidden=true;retry.hidden=true;render(['doing','pending','pending','pending','pending','pending']);poll()};render(['doing','pending','pending','pending','pending','pending']);poll();
</script></body></html>
