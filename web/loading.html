<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALK 正在启动</title>
<script>(function(){var m='midnight';try{var s=localStorage.getItem('talk-theme-mode');m=s==='light'||s==='daylight'?'daylight':s==='auto'&&new Date().getHours()>=8&&new Date().getHours()<18?'daylight':'midnight'}catch(e){}document.documentElement.dataset.theme=m})()</script>
<link rel="stylesheet" href="/theme-tokens.css?v=821">
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,var(--glow),var(--bg));color:var(--text);font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(540px,90vw);text-align:center;padding:40px 24px}.orbit{width:94px;height:94px;margin:0 auto 32px;border:2px solid var(--line-strong);border-top-color:var(--blue);border-radius:50%;animation:spin 1.5s linear infinite;display:grid;place-items:center}.orbit span{animation:spin 1.5s linear infinite reverse;font-weight:800;color:var(--blue)}h1{font-size:27px;letter-spacing:.12em}p{color:var(--muted-strong)}.progress{height:8px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin:48px 0 14px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s}.step{min-height:24px}button{background:var(--accent-bg);color:var(--accent-fg);border:0;border-radius:var(--radius);padding:10px 25px;cursor:pointer}#error{color:var(--red);line-height:1.6}.runner-note{margin-top:24px;text-align:left;padding:16px;border-radius:var(--radius);border:1px solid var(--line);line-height:1.6}.runner-note p{margin:6px 0 0}.runner-note.none{background:var(--warning-bg);border-color:var(--amber)}.runner-note.detected{background:var(--success-bg);border-color:var(--green)}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orbit,.orbit span{animation:none}}
</style></head><body><main class="card"><div class="orbit"><span>TALK</span></div><h1>欢迎回来</h1><p>正在准备你的协作空间</p><div class="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="step" id="step">启动服务</div><div id="runner-none" class="runner-note none" hidden><strong>未检测到可用的运行器：服务已启动但尚未接入 TALK，当前无法分配或接收任务</strong><p>请安装 Codex、KimiCode、WorkBuddy 或 DSH，随后重新启动并完成接入。</p></div><div id="runner-detected" class="runner-note detected" hidden><strong id="runner-detected-text"></strong></div><div id="error" role="alert" hidden></div><button id="retry" hidden>重试</button></main>
<script>
const start=performance.now(), step=document.querySelector('#step'), error=document.querySelector('#error'), retry=document.querySelector('#retry'), bar=document.querySelector('#bar'), progress=document.querySelector('.progress'); let failures=0,timer;
function fail(message){clearTimeout(timer);step.textContent='启动遇到问题';error.textContent=message+' 请查看 logs/launcher/。';error.hidden=false;retry.hidden=false}
async function poll(){try{const response=await fetch('/api/boot/status',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();failures=0;const runners=data.runners||{none:true,detected:[]}, names={codex:'Codex',kimi:'KimiCode',workbuddy:'WorkBuddy',dsh:'DSH'};document.querySelector('#runner-none').hidden=!runners.none;document.querySelector('#runner-detected').hidden=runners.none;document.querySelector('#runner-detected-text').textContent='本机已安装 '+runners.detected.map(n=>names[n]||n).join('、')+'，可接入使用';if(!data.ready){fail('启动阶段报错。');return}const stages=data.stages||[];let i=0;function show(){if(i>=stages.length){const target=new URL('/',location.origin);if(new URLSearchParams(location.search).get('desktop')==='1')target.search='?desktop=1';setTimeout(()=>location.replace(target),Math.max(0,600-(performance.now()-start)));return}const stage=stages[i++];step.textContent=stage.name+(stage.text?'：'+stage.text:'');let value=Math.round(i/stages.length*100);bar.style.width=value+'%';progress.setAttribute('aria-valuenow',value);timer=setTimeout(show,120)}show()}catch(e){if(++failures>=3){fail('无法连接启动状态接口。');return}timer=setTimeout(poll,300)}}retry.onclick=()=>{failures=0;error.hidden=true;retry.hidden=true;step.textContent='重新检查启动状态';poll()};poll();
</script></body></html>
